services:
  database:
    build: ./Database

    container_name: my-database

    environment:
      POSTGRES_DB: db
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: pwd

    networks:
      - app-network

  # Two instances of the same backend, load balanced by the reverse proxy
  backend-blue:
    build: ./BackendAPI

    container_name: backend-blue

    depends_on:
      - database
    networks:
      - app-network

  backend-green:
    build: ./BackendAPI

    container_name: backend-green

    depends_on:
      - database
    networks:
      - app-network

  reverse-proxy:
    build: ./HttpServer

    container_name: reverse-proxy

    ports:
      - "80:80"

    depends_on:
      - backend-blue
      - backend-green

    networks:
      - app-network

networks:
  app-network:
    driver: bridge
